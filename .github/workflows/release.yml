# Tagged releases: prebuilt install trees per platform (headers + libs + CMake package).
# Create a release with: git tag v1.x.y && git push origin v1.x.y
#
# workflow_dispatch runs the build jobs only (artifacts on the run); the Publish step
# runs only for tag pushes (refs/tags/v*).
#
# Local dry-runs: see scripts/ci/ci-build-*.sh and scripts/ci/ci-build-windows-x64.ps1
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  VCPKG_ROOT: ${{ github.workspace }}/vcpkg
  VCPKG_COMMIT: 522253caf47268c1724f486a035e927a42a90092

jobs:
  build-linux-x64:
    name: Package Linux x64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: lukka/get-cmake@latest

      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config

      - name: Build and package
        env:
          PACKAGE_NAME: GameNetworkingSockets-${{ github.ref_name }}-linux-x64
        run: bash "${{ github.workspace }}/scripts/ci/ci-build-linux-x64.sh"

      - uses: actions/upload-artifact@v4
        with:
          name: package-linux-x64
          path: GameNetworkingSockets-${{ github.ref_name }}-linux-x64.tar.gz

  build-windows-x64:
    name: Package Windows x64 (OpenSSL)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: lukka/get-cmake@latest
      - uses: ilammy/msvc-dev-cmd@v1

      - name: Build and package
        env:
          PACKAGE_NAME: GameNetworkingSockets-${{ github.ref_name }}-windows-x64
        run: pwsh "${{ github.workspace }}/scripts/ci/ci-build-windows-x64.ps1"

      - uses: actions/upload-artifact@v4
        with:
          name: package-windows-x64
          path: GameNetworkingSockets-${{ github.ref_name }}-windows-x64.zip

  build-macos-arm64:
    name: Package macOS arm64
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: lukka/get-cmake@latest

      - name: Build and package
        env:
          PACKAGE_NAME: GameNetworkingSockets-${{ github.ref_name }}-macos-arm64
        run: bash "${{ github.workspace }}/scripts/ci/ci-build-macos-arm64.sh"

      - uses: actions/upload-artifact@v4
        with:
          name: package-macos-arm64
          path: GameNetworkingSockets-${{ github.ref_name }}-macos-arm64.tar.gz

  build-android:
    name: Package Android ${{ matrix.triplet }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - triplet: arm64-android
            abi: arm64-v8a
          - triplet: arm-neon-android
            abi: armeabi-v7a
    steps:
      - uses: actions/checkout@v4

      - uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26d
          link-to-sdk: false

      - uses: lukka/get-cmake@latest

      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config

      - name: Build and package
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          PACKAGE_NAME: GameNetworkingSockets-${{ github.ref_name }}-android-${{ matrix.triplet }}
        run: bash "${{ github.workspace }}/scripts/ci/ci-build-android.sh" --triplet ${{ matrix.triplet }} --abi ${{ matrix.abi }}

      - uses: actions/upload-artifact@v4
        with:
          name: package-android-${{ matrix.triplet }}
          path: GameNetworkingSockets-${{ github.ref_name }}-android-${{ matrix.triplet }}.tar.gz

  build-ios:
    name: Package iOS ${{ matrix.triplet }}
    runs-on: macos-latest
    strategy:
      matrix:
        triplet:
          - arm64-ios
          - arm64-ios-simulator
          - x64-ios
    steps:
      - uses: actions/checkout@v4

      - uses: lukka/get-cmake@latest

      - name: Build and package
        env:
          PACKAGE_NAME: GameNetworkingSockets-${{ github.ref_name }}-ios-${{ matrix.triplet }}
        run: bash "${{ github.workspace }}/scripts/ci/ci-build-ios.sh" --triplet ${{ matrix.triplet }}

      - uses: actions/upload-artifact@v4
        with:
          name: package-ios-${{ matrix.triplet }}
          path: GameNetworkingSockets-${{ github.ref_name }}-ios-${{ matrix.triplet }}.tar.gz

  publish:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - build-linux-x64
      - build-windows-x64
      - build-macos-arm64
      - build-android
      - build-ios
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: package-*
          merge-multiple: true

      - name: Flatten assets
        run: bash "${{ github.workspace }}/scripts/ci/flatten-release-assets.sh" dist release-assets

      - uses: softprops/action-gh-release@v2
        with:
          draft: false
          generate_release_notes: true
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
