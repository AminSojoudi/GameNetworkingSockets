# Build GameNetworkingSockets for Android using vcpkg + NDK.
# Does not run unit tests (binaries target Android, not the GitHub runner).
name: Android

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  VCPKG_ROOT: ${{ github.workspace }}/vcpkg
  VCPKG_COMMIT: 522253caf47268c1724f486a035e927a42a90092

jobs:
  build-android:
    name: Android ${{ matrix.abi }} (${{ matrix.triplet }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - triplet: arm64-android
            abi: arm64-v8a
          - triplet: arm-neon-android
            abi: armeabi-v7a
    steps:
      - uses: actions/checkout@v4

      - uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26d
          link-to-sdk: false

      - uses: lukka/get-cmake@latest

      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config

      - name: Build (no install)
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: bash "${{ github.workspace }}/scripts/ci/ci-build-android.sh" --triplet ${{ matrix.triplet }} --abi ${{ matrix.abi }} --no-install

      - name: Upload shared library
        uses: actions/upload-artifact@v4
        with:
          name: libgns-android-${{ matrix.triplet }}
          path: build-android-${{ matrix.triplet }}/bin/libGameNetworkingSockets.so
          if-no-files-found: error
