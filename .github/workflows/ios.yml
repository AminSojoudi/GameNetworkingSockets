# iOS device + simulator static libraries (vcpkg triplets). macOS + Xcode only.
name: iOS

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ios-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  VCPKG_ROOT: ${{ github.workspace }}/vcpkg
  VCPKG_COMMIT: fba75d09065fcc76a25dcf386b1d00d33f5175af

jobs:
  build-ios:
    name: iOS ${{ matrix.triplet }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        triplet:
          - arm64-ios
          - arm64-ios-simulator
          - x64-ios
    steps:
      - uses: actions/checkout@v4

      - uses: lukka/get-cmake@latest

      - name: Verify CI scripts (ensure scripts/ci is committed and pushed)
        run: |
          f="${{ github.workspace }}/scripts/ci/build-ios.sh"
          if [[ ! -f "$f" ]]; then
            echo "::error::Missing $f — add the scripts/ci directory to this branch and push."
            ls -la "${{ github.workspace }}/scripts" 2>/dev/null || echo "(no scripts/ directory)"
            exit 127
          fi

      - name: Build and install
        run: bash "${{ github.workspace }}/scripts/ci/build-ios.sh" --triplet ${{ matrix.triplet }}

      - name: Upload install tree
        uses: actions/upload-artifact@v4
        with:
          name: gns-ios-${{ matrix.triplet }}
          path: install-ios-${{ matrix.triplet }}
